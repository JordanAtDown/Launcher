[package]
name = "cec-daemon"
version.workspace = true
edition = "2021"
description = "HDMI CEC TV Control Daemon"

[dependencies]
windows-sys = { version = "0.48", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_Power",
    "Win32_UI_WindowsAndMessaging",
] }
log = "0.4"
simplelog = "0.12"

[build-dependencies]
winres = "0.1"
